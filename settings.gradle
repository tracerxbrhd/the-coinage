pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' }
rootProject.name = 'the-coinage'

def configuredUApiBuild = providers.gradleProperty('u_api_local_path').orNull
def configuredUApiDirectory = configuredUApiBuild ? file(configuredUApiBuild) : null
def localUApiBuild = file('u-api')
def siblingUApiBuild = file('../u-api-26.2')
def uApiBuild = configuredUApiDirectory != null && configuredUApiDirectory.isDirectory() ? configuredUApiDirectory
    : (localUApiBuild.isDirectory() ? localUApiBuild
    : (siblingUApiBuild.isDirectory() ? siblingUApiBuild : null)
    )

if (uApiBuild != null) {
    includeBuild(uApiBuild) {
        dependencySubstitution {
            substitute module('dev.uapi:u-api') using project(':')
        }
    }
} else {
    println 'U-API composite build was not found; resolving dev.uapi:u-api from configured repositories.'
}

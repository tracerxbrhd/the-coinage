plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base { archivesName = 'the-coinage' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                file('src/generated/resources/').absolutePath, '--existing',
                file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "dev.uapi:u-api:${u_api_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
        u_api_version_range: u_api_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = 'the-coinage'
        }
    }
    repositories { maven { url = "file://${project.projectDir}/repo" } }
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}

tasks.named('jar') {
    archiveVersion.set("${project.mod_version}+mc${project.minecraft_version}")
    from('LICENSE') { into 'META-INF' }
}

def resourceDirectory = layout.projectDirectory.dir('src/main/resources').asFile
def englishLanguageFile = new File(resourceDirectory, 'assets/the_coinage/lang/en_us.json')
def russianLanguageFile = new File(resourceDirectory, 'assets/the_coinage/lang/ru_ru.json')

tasks.register('validateResources') {
    group = 'verification'
    description = 'Validates JSON resources and translation parity.'
    inputs.dir(resourceDirectory)
    doLast {
        def jsonSlurper = new groovy.json.JsonSlurper()
        resourceDirectory.eachFileRecurse(groovy.io.FileType.FILES) { resourceFile ->
            if (resourceFile.name.endsWith('.json')) {
                jsonSlurper.parse(resourceFile)
            }
        }
        def en = jsonSlurper.parse(englishLanguageFile) as Map
        def ru = jsonSlurper.parse(russianLanguageFile) as Map
        def missingRu = en.keySet() - ru.keySet()
        def missingEn = ru.keySet() - en.keySet()
        if (!missingRu.empty || !missingEn.empty) {
            throw new GradleException("Translation keys differ. Missing ru_ru=${missingRu}; missing en_us=${missingEn}")
        }
        [
            'data/curios/tags/item/curio.json',
            'data/accessories/tags/item/belt.json',
            'data/accessories/tags/item/charm.json'
        ].each { relativePath ->
            def tag = jsonSlurper.parse(new File(resourceDirectory, relativePath)) as Map
            if (!(tag.values instanceof List) || !tag.values.contains('the_coinage:coin_purse')) {
                throw new GradleException("Coin Purse is missing from accessory tag ${relativePath}")
            }
        }
    }
}

tasks.named('check') { dependsOn tasks.named('validateResources') }
